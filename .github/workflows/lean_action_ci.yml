name: Lean Action CI

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lean-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@v5
      - name: Prepare Comparator sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Permit uid mapping inside bubblewrap on this ephemeral Ubuntu runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --ro-bind / / true
      - uses: leanprover/lean-action@v1
      - name: Verify structural proofs and axioms
        run: |
          lake build --wfail
          lake env lean -j2 -M4096 -DwarningAsError=true Audit.lean > axioms.log
          python3 scripts/check_axioms.py Audit.lean axioms.log
      - name: Check public-paper correspondence
        run: python3 scripts/check_paper_coverage.py
      - name: Check paper statements with Comparator
        run: lake comparator --config=ComparatorChallenges/config.json
      - name: Checkout documentation tooling
        uses: actions/checkout@v5
        with:
          repository: leanprover-community/docgen-action
          ref: 56dff2bb89f3e9b8c1b6d5c8410362c19de2d904
          path: .lake/docgen-action
      - name: Read documentation metadata
        id: docs
        run: node .lake/docgen-action/dist/index.js
      - name: Cache dependency documentation
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.docs.outputs.cached_docbuild_dependencies }}
          key: Docs-${{ hashFiles('lake-manifest.json') }}
      - name: Render Lean API documentation
        run: bash .lake/docgen-action/scripts/build_docs.sh
        env:
          NAME: ${{ steps.docs.outputs.name }}
          DOCS_FACETS: ${{ steps.docs.outputs.docs_facets }}
          HOMEPAGE: .lake/pages
      - name: Add documentation entry page
        run: |
          python3 - <<'PYTHON'
          import html
          import os
          from pathlib import Path
          base = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          values = {
              '__SOURCE_BASE__': base + '/blob/' + commit,
              '__README_URL__': base + '/tree/' + commit + '#readme',
              '__BRANCH__': os.environ['GITHUB_REF_NAME'],
              '__SHORT_SHA__': commit[:7],
          }
          page = Path('.github/pages/index.html').read_text()
          for key, value in values.items():
              page = page.replace(key, html.escape(value, quote=True))
          Path('.lake/pages/index.html').write_text(page)
          PYTHON
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .lake/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
